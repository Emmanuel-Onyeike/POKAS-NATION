<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokas Nation - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/WhatsApp Image 2025-08-21 at 00.21.37.jpeg" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
    <div class="w-full max-w-lg bg-neutral-900 rounded-2xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-red-600 text-center mb-6">Pokas Nation</h1>
        <h2 class="text-xl text-white text-center mb-6">Create an Account</h2>

        <form id="register-form" class="space-y-4">
            <div>
                <label for="full-name" class="block text-gray-300 mb-1">Full Name</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-id-card text-red-800 mr-2"></i>
                    <input type="text" id="full-name" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Enter your full name" required>
                </div>
            </div>

            <div>
                <label for="register-email" class="block text-gray-300 mb-1">Email</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-envelope text-red-800 mr-2"></i>
                    <input type="email" id="register-email" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Enter your email" required>
                </div>
            </div>

            <div>
                <label for="register-username" class="block text-gray-300 mb-1">Username</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-user text-red-800 mr-2"></i>
                    <input type="text" id="register-username" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Choose a username" required>
                </div>
            </div>

            <div>
                <label for="phone-number" class="block text-gray-300 mb-1">Phone Number</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-phone text-red-800 mr-2"></i>
                    <input type="tel" id="phone-number" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Enter your phone number">
                </div>
            </div>

            <div>
                <label for="register-password" class="block text-gray-300 mb-1">Password</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-lock text-red-800 mr-2"></i>
                    <input type="password" id="register-password" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Enter password" required>
                </div>
            </div>

            <div>
                <label for="confirm-password" class="block text-gray-300 mb-1">Confirm Password</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-lock text-red-800 mr-2"></i>
                    <input type="password" id="confirm-password" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Confirm password" required>
                </div>
            </div>

            <div id="register-message" class="text-center text-sm font-semibold mt-4 hidden"></div>

            <button type="submit" id="register-btn" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-semibold transition text-center">
                Register
            </button>
        </form>

        <p class="text-gray-400 text-center mt-6">Already have an account? 
            <a href="login.html" class="text-red-500 hover:underline">Login</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
