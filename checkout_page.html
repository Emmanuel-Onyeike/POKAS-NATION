<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokas Nation - Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #1a1a1a;
        }
        .tab-button.active {
            border-bottom: 2px solid #ef4444;
            color: #ffffff;
        }
    </style>
</head>
<body class="text-white font-sans antialiased">

    <nav class="hidden md:block bg-gray-900 border-b border-gray-800 py-3 shadow-sm z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-center space-x-12 text-lg font-semibold">
            <a href="dashboard.html" class="flex items-center gap-2 hover:text-red-500 transition-colors">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="arrivals.html" class="flex items-center gap-2 hover:text-red-500 transition-colors">
                <i class="fas fa-store"></i> New Arrivals
            </a>
            <a href="trending.html" class="flex items-center gap-2 hover:text-red-500 transition-colors">
                <i class="fas fa-fire"></i> Trending
            </a>
            <a href="exclusive.html" class="flex items-center gap-2 hover:text-red-500 transition-colors">
                <i class="fas fa-star"></i> Exclusive
            </a>
            <a href="categories.html" class="flex items-center gap-2 hover:text-red-500 transition-colors">
                <i class="fas fa-th-list"></i> Categories
            </a>
        </div>
    </nav>
    
    <header class="sticky top-0 left-0 right-0 z-50 bg-[#1a1a1a] shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <button id="delivery-tab" class="tab-button active text-sm sm:text-base font-semibold px-2 py-1 sm:px-4 sm:py-2 transition-colors duration-200">
                    Delivery
                </button>
                <button id="payment-tab" class="tab-button text-sm sm:text-base font-semibold px-2 py-1 sm:px-4 sm:py-2 transition-colors duration-200">
                    Payment
                </button>
                <button id="summary-tab" class="tab-button text-sm sm:text-base font-semibold px-2 py-1 sm:px-4 sm:py-2 transition-colors duration-200">
                    Summary
                </button>
            </div>
        </div>
    </header>

    <main class="pt-8 pb-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <section id="delivery-content" class="tab-content">
            <h2 class="text-2xl sm:text-3xl font-bold mb-6">Delivery Information</h2>
            <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                <p>Please enter your delivery address and contact details here.</p>
            </div>
        </section>

        <section id="payment-content" class="tab-content hidden">
            <h2 class="text-2xl sm:text-3xl font-bold mb-6">Payment Method</h2>
            <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                <p>Choose your preferred payment method and enter your details.</p>
            </div>
        </section>

        <section id="summary-content" class="tab-content hidden">
            <h2 class="text-2xl sm:text-3xl font-bold mb-6">Order Summary</h2>
            <div class="bg-gray-800 p-6 rounded-lg shadow-md">
                <p>Review your order details, including items, costs, and chosen options.</p>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab-button');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    contents.forEach(content => content.classList.add('hidden'));
                    
                    const targetId = tab.id.replace('-tab', '-content');
                    document.getElementById(targetId).classList.remove('hidden');
                });
            });
        });
    </script>
</body>
</html>
