<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokas Nation - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/WhatsApp Image 2025-08-21 at 00.21.37.jpeg" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md bg-neutral-900 rounded-2xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-red-600 text-center mb-6">Pokas Nation</h1>
        <h2 class="text-xl text-white text-center mb-6">Login to your account</h2>

        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-email" class="block text-gray-300 mb-1">Email</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-envelope text-red-800 mr-2"></i>
                    <input type="email" id="login-email" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Enter your email" required>
                </div>
            </div>

            <div>
                <label for="login-password" class="block text-gray-300 mb-1">Password</label>
                <div class="flex items-center bg-neutral-800 rounded-lg px-3">
                    <i class="fa fa-lock text-red-800 mr-2"></i>
                    <input type="password" id="login-password" class="w-full bg-transparent text-white py-2 focus:outline-none" placeholder="Enter your password" required>
                </div>
            </div>

            <div id="login-message" class="text-center text-sm font-semibold mt-4 hidden"></div>

            <button type="submit" id="login-btn" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-semibold transition text-center block">
                Login
            </button>
        </form>

        <p class="text-gray-400 text-center mt-6">Don’t have an account?
            <a href="register.html" class="text-red-500 hover:underline">Register</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
